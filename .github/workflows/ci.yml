name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: data-pipeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust Pipeline Tests
        run: cargo test --manifest-path data-pipeline/Cargo.toml

      - name: Test Pipeline on Fixture Dataset
        run: |
          mkdir -p target/ci_output
          cargo run --manifest-path data-pipeline/Cargo.toml -- ingest \
            --input data/fixtures/sample_meteors.parquet \
            --output target/ci_output
          cargo run --manifest-path data-pipeline/Cargo.toml -- verify \
            --dir target/ci_output

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Test Suites
        run: pnpm test

      - name: Build Web & Worker
        run: pnpm build
