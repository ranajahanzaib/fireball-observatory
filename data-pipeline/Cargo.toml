[package]
name = "fireball-pipeline"
version = "0.1.0"
edition = "2021"
description = "Analytical ingestion and precomputation CLI for Global Meteor Network trajectory data"
license = "MIT"
authors = ["Rana Jahanzaib"]
repository = "https://github.com/ranajahanzaib/fireball-observatory"

[dependencies]
anyhow = "1.0.104"
arrow = "60.1.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
hex = "0.4.3"
parquet = "60.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
